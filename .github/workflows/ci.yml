name: CI
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang python3-numpy
      - name: Fetch tokenizer (9 MB; model weights not needed)
        run: |
          mkdir -p models/hf/bitnet-b1.58-2B-4T
          curl -sSL --fail -o models/hf/bitnet-b1.58-2B-4T/tokenizer.json \
            https://huggingface.co/microsoft/bitnet-b1.58-2B-4T/resolve/main/tokenizer.json
      - name: Build
        run: make -j
      - name: Unit + mock-model tests (scalar fallbacks on x86-64)
        run: make test-mock
      - name: AVX2 vs scalar bit-identity (mock model logits)
        run: |
          grep -m1 -o "AVX2 ([^)]*)" <(build/test_dot_product)          # the AVX2 path is the one running
          F="-O3 -march=native -mavx2 -mfma -mf16c -Wall -Wextra -std=c11"
          make BUILD=build-scalar CFLAGS="$F -DBITNET_FORCE_SCALAR" build-scalar/test_transformer build-scalar/test_dot_product
          build-scalar/test_dot_product | grep -m1 "scalar (no SIMD)"
          # Integer AVX2 kernels must be exact: compare with F16C off (F16C reorders the float16 sum).
          make BUILD=build-avx2-exact CFLAGS="$F -DBITNET_NO_F16C" build-avx2-exact/test_transformer
          T=models/hf/bitnet-b1.58-2B-4T/tokenizer.json
          build-avx2-exact/test_transformer build/mock/mock.bitnet $T build/mock/mock.ref_logits --no-unit-tests --dump-logits avx2.f32 | grep "Logits dump"
          build-scalar/test_transformer build/mock/mock.bitnet $T build/mock/mock.ref_logits --no-unit-tests --dump-logits scalar.f32 | grep "Logits dump"
          cmp avx2.f32 scalar.f32 && echo "AVX2 and scalar logits are bit-identical ($(wc -c < avx2.f32) bytes)"
      - name: F16C float16 KV-cache conversion == scalar for every float32
        run: build/test_transformer build/mock/mock.bitnet models/hf/bitnet-b1.58-2B-4T/tokenizer.json --exhaustive-f16 --quick | grep "f16 KV cache"
      - name: Shared library + Python bindings
        run: |
          make lib
          test -f build/libbitnet.so && test -f build/libbitnet.a
          python3 tools/bitnet.py          # loads libbitnet.so via ctypes; no model -> error path only
          ./tools/download_model.sh --help | head -3

  android:
    # Cross-compiles for Android arm64 with the runner's NDK, then runs the
    # mock-model suites on the static Android binaries under qemu-aarch64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y python3-numpy qemu-user-static
      - name: Fetch tokenizer (9 MB; model weights not needed)
        run: |
          mkdir -p models/hf/bitnet-b1.58-2B-4T
          curl -sSL --fail -o models/hf/bitnet-b1.58-2B-4T/tokenizer.json \
            https://huggingface.co/microsoft/bitnet-b1.58-2B-4T/resolve/main/tokenizer.json
      - name: Build for Android arm64-v8a (NDK)
        run: |
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          make -j android ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          file build-android/bitnet build-android/libbitnet.so
      - name: Mock-model suites on the Android binaries (qemu-aarch64)
        run: |
          build-android/test_dot_product | grep -m1 -o "SDOT[^|]*"     # the NEON + SDOT path is running
          QEMU_CPU=max make android-test-mock ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
